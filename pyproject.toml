[project]
name = "build-an-ai-agent"
version = "0.1.0"
description = "Build an AI Agent from Scratch - companion code repository"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai>=1.50.0",
    "anthropic>=0.40.0",
    "litellm>=1.83.7",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "tavily-python>=0.5.0",
    "mcp>=1.0.0",
    "fastmcp>=0.1.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "tiktoken>=0.7.0",
    "chromadb>=0.5.0",
    "e2b-code-interpreter>=1.0.0",
    "pandas>=2.0",
    "openpyxl>=3.1.0",
    "pymupdf>=1.24.0",
    "httpx>=0.27.0",
    "datasets>=2.0",
    "tqdm>=4.0",
    "jupyterlab>=4.0",
    "python-docx>=1.0.0",
    "pre-commit>=4.6.0",
    "scratchagent>=0.1.0",
    "aitils",
    "argparse>=1.4.0",
    "streamlit>=1.40.0",
]

[tool.uv.sources]
aitils = { git = "https://github.com/delaray/aitils", rev = "main" }

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# This module deliberately loads .env before importing LiteLLM because
# LiteLLM reads startup configuration during import.
"src/llm.py" = ["E402", "I001"]
